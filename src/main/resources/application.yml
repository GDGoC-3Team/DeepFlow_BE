server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/deepflowdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: false
  task:
    scheduling:
      pool:
        size: 5

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

gcp:
  storage:
    bucket: ${GCS_BUCKET}
    credentials: ${GCS_CREDENTIALS_JSON}
    project-id: ${GCP_PROJECT_ID}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
