services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deepflowdb
      MYSQL_ROOT_PASSWORD: deepflowdb123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data.csv:/docker-entrypoint-initdb.d/data.csv
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pdeepflowdb123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: jjy12163/deepflow-backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/deepflowdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: deepflowdb123
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
