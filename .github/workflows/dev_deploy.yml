name: Dev Deploy

on:
  push:
    branches: [develop, feat/#2-deployment]
  workflow_dispatch:

concurrency:
  group: dev-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  IMAGE_NAME: deepflow-backend
  VM_HOST: ${{ vars.GCE_VM_HOST }}
  VM_USER: ${{ vars.GCE_VM_USER }}
  VM_PORT: ${{ vars.GCE_VM_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.GCE_DEPLOY_PATH || '/home/deploy/deepflow' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
          VM_HOST: ${{ vars.GCE_VM_HOST }}
          VM_USER: ${{ vars.GCE_VM_USER }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          GCE_SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          DEV_MYSQL_ROOT_PASSWORD: ${{ secrets.DEV_MYSQL_ROOT_PASSWORD }}
        run: |
          set -eu
          [ -n "$PROJECT_ID" ] || { echo "Missing variable: GCP_PROJECT_ID"; exit 1; }
          [ -n "$REGION" ] || { echo "Missing variable: GCP_REGION"; exit 1; }
          [ -n "$ARTIFACT_REPOSITORY" ] || { echo "Missing variable: GCP_ARTIFACT_REGISTRY_REPOSITORY"; exit 1; }
          [ -n "$VM_HOST" ] || { echo "Missing variable: GCE_VM_HOST"; exit 1; }
          [ -n "$VM_USER" ] || { echo "Missing variable: GCE_VM_USER"; exit 1; }
          [ -n "$GCP_SERVICE_ACCOUNT_KEY" ] || { echo "Missing secret: GCP_SERVICE_ACCOUNT_KEY"; exit 1; }
          [ -n "$FIREBASE_CREDENTIALS" ] || { echo "Missing secret: FIREBASE_CREDENTIALS"; exit 1; }
          [ -n "$GCE_SSH_PRIVATE_KEY" ] || { echo "Missing secret: GCE_SSH_PRIVATE_KEY"; exit 1; }
          [ -n "$DEV_MYSQL_ROOT_PASSWORD" ] || { echo "Missing secret: DEV_MYSQL_ROOT_PASSWORD"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: sh ./gradlew test --no-daemon

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud auth
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:develop \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:develop

      - name: Export Docker image
        run: docker save ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -o deepflow-backend.tar

      - name: Fix tar permission
        run: |
          sudo chown runner:docker deepflow-backend.tar || true
          chmod 644 deepflow-backend.tar

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          port: ${{ env.VM_PORT }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          source: "src/main/resources/init.sql,src/main/resources/data.csv,deepflow-backend.tar"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy on Compute Engine VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          SPRING_PROFILE: gcp
          MYSQL_DATABASE: deepflowdb
          MYSQL_ROOT_PASSWORD: ${{ secrets.DEV_MYSQL_ROOT_PASSWORD }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          port: ${{ env.VM_PORT }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          envs: IMAGE_URI,DEPLOY_PATH,SPRING_PROFILE,MYSQL_DATABASE,MYSQL_ROOT_PASSWORD,GCP_SERVICE_ACCOUNT_KEY,FIREBASE_CREDENTIALS
          script: |
            set -euxo pipefail
            trap 'echo "[ERROR] Command failed at line $LINENO"' ERR
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if ! command -v docker >/dev/null 2>&1; then
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "Docker is not installed and apt-get is unavailable on the VM."
                exit 1
              fi

              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-plugin
              sudo systemctl enable --now docker
            fi

            if ! sudo docker compose version >/dev/null 2>&1; then
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "Docker Compose plugin is not available and apt-get is unavailable on the VM."
                exit 1
              fi

              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            [ -f deepflow-backend.tar ] || { echo "Missing deepflow-backend.tar in deploy path"; exit 1; }
            [ -f src/main/resources/init.sql ] || { echo "Missing src/main/resources/init.sql in deploy path"; exit 1; }
            [ -f src/main/resources/data.csv ] || { echo "Missing src/main/resources/data.csv in deploy path"; exit 1; }

            cp src/main/resources/init.sql ./init.sql
            cp src/main/resources/data.csv ./data.csv
            mkdir -p secrets
            printf '%s' "$FIREBASE_CREDENTIALS" > ./secrets/firebase-credentials.json
            chmod 600 ./secrets/firebase-credentials.json

            echo "[INFO] Deployment directory contents"
            ls -la

            echo "[INFO] Docker version"
            sudo docker version

            echo "[INFO] Docker Compose version"
            sudo docker compose version

            cat > .env <<EOF
            SPRING_PROFILES_ACTIVE=$SPRING_PROFILE
            FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-credentials.json
            SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/$MYSQL_DATABASE
            SPRING_DATASOURCE_USERNAME=root
            SPRING_DATASOURCE_PASSWORD=$MYSQL_ROOT_PASSWORD
            EOF

            cat > docker-compose.dev.yml <<EOF
            services:
              mysql:
                image: mysql:8
                container_name: deepflow-mysql
                restart: unless-stopped
                environment:
                  MYSQL_DATABASE: $MYSQL_DATABASE
                  MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
                ports:
                  - "3306:3306"
                volumes:
                  - mysql-data:/var/lib/mysql
                  - ./init.sql:/docker-entrypoint-initdb.d/init.sql
                  - ./data.csv:/var/lib/mysql-files/data.csv
                healthcheck:
                  test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 30s

              backend:
                image: $IMAGE_URI
                container_name: deepflow-backend
                restart: unless-stopped
                depends_on:
                  mysql:
                    condition: service_healthy
                env_file:
                  - .env
                ports:
                  - "8080:8080"
                volumes:
                  - ./secrets/firebase-credentials.json:/run/secrets/firebase-credentials.json:ro

            volumes:
              mysql-data:
            EOF

            echo "[INFO] Loading Docker image tar"
            sudo docker load -i deepflow-backend.tar

            echo "[INFO] Rendered compose file"
            cat docker-compose.dev.yml

            echo "[INFO] Starting containers"
            sudo docker rm -f deepflow-backend deepflow-mysql || true
            sudo docker compose -f docker-compose.dev.yml up -d --remove-orphans

            echo "[INFO] Container status after deploy"
            sudo docker compose -f docker-compose.dev.yml ps -a

            echo "[INFO] Recent container logs"
            sudo docker compose -f docker-compose.dev.yml logs --tail=200 || true
