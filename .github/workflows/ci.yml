name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: deepflowdb
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/deepflowdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase credentials file
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then
            printf '%s' "$FIREBASE_CREDENTIALS_JSON" > "$GITHUB_WORKSPACE/firebase-credentials.json"
            echo "FIREBASE_CREDENTIALS_PATH=$GITHUB_WORKSPACE/firebase-credentials.json" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: sh ./gradlew clean test --no-daemon

      - name: Build bootJar
        run: sh ./gradlew bootJar --no-daemon

      - name: Smoke test application startup
        shell: bash
        run: |
          set -euo pipefail
          java -jar build/libs/*.jar --server.port=0 > app-start.log 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if grep -q "Started AppApplication" app-start.log; then
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat app-start.log
              exit 1
            fi

            sleep 2
          done

          cat app-start.log
          exit 1

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
